name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Go tests that need TeX skip when it is absent, so only Linux runs them.
      - name: Install TeX
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-recommended texlive-latex-extra texlive-plain-generic texlive-bibtex-extra biber
      - run: make lint
      - run: make test
      - run: make build
      - name: End-to-end tests
        if: runner.os == 'Linux'
        run: make e2e

  # make test above already runs the installer and the in-app update on each
  # platform. This job runs both again on their own, where replacing a running
  # program differs, and also opens the installed app the way a person does:
  # the .app bundle on macOS, the Start menu shortcut on Windows.
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -run 'TestInstallScript|TestUpdateReplacesTheRunningProgram' -v ./cmd/revisions
        env:
          REVISIONS_TEST_LAUNCH: "1"
