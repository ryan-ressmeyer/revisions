name: Release

# Pushing a tag such as v0.1.0 builds Revisions for every supported platform
# and publishes a GitHub Release with the programs, the install scripts, and a
# SHA256SUMS file that the install scripts check. Tag a commit whose CI passed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web UI
        run: cd web && npm ci && npm run build
      # Every dependency builds without cgo, so one Linux runner builds all five.
      - name: Build each platform
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os=${target%/*} arch=${target#*/} ext=
            if [ "$os" = windows ]; then ext=.exe; fi
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" \
              -o "dist/revisions-$os-$arch$ext" ./cmd/revisions
          done
          cp scripts/install.sh scripts/install.ps1 dist/
          cd dist && sha256sum * > SHA256SUMS
      - name: Check the version stamp
        run: test "$(dist/revisions-linux-amd64 --version)" = "revisions $GITHUB_REF_NAME"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Revisions $GITHUB_REF_NAME" --generate-notes
